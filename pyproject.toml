[project]
name = "adachi-inpaint-workbench"
version = "0.6.4"
description = "Inline mask painting and WebUI-style inpainting nodes for ComfyUI"
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Adachi" }]
dependencies = ["numpy", "Pillow", "torch"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/adachi0130/Adachi-Inpaint-Workbench"
Documentation = "https://github.com/adachi0130/Adachi-Inpaint-Workbench#readme"
"Bug Tracker" = "https://github.com/adachi0130/Adachi-Inpaint-Workbench/issues"

[tool.comfy]
PublisherId = "adachi0130"
DisplayName = "Adachi-Inpaint-Workbench"

[tool.adachi-workbench]
frontend = "web"
