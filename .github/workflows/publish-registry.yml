name: Publish to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify publisher configuration
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          if not config['tool']['comfy']['PublisherId'].strip():
              raise SystemExit('Set tool.comfy.PublisherId to your registered publisher ID before publishing.')
          if not os.environ.get('REGISTRY_ACCESS_TOKEN'):
              raise SystemExit('Add your Registry API key as the REGISTRY_ACCESS_TOKEN repository secret.')
          PY
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
